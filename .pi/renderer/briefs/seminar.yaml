# 写作方向：研讨型
#
# 本文件**只放机检项**（`check:` 段，给 qc 读）+ 方向要点。
# 完整的写作规范在 .pi/skills/ppt-seminar/SKILL.md，通用规则在 ppt-common/SKILL.md ——
# 2026-09 起 `writing:` 不再重复它们（原来 80 行与 SKILL.md 逐条重复，Agent 每任务要读两遍）。
name: seminar
label: 研讨型
version: 2
skill: skills/ppt-seminar/SKILL.md   # .pi/tests/briefs.py 会校验它存在，防两边脱节

check:
  # 页数：不设上限，资料有多少就摆多少。唯一例外是预计超过 askAbove 时先问用户。
  # （原先还有 `minPages: 1` 与 `maxSupportsPerPage: 4` —— 任何 deck 都 ≥1 页、
  #   statement.points 本来就 ≤4，两条都永远不触发，等于没检查，已删。）
  askAbove: 50

  # 交稿前必须核对「输入覆盖度」：不加 --source 跑 --qc 就点名提醒
  # （丢内容是最难被抓到的偷懒方式：版式装不下 → 删两页 → 页内检查全绿）
  requireSource: true

  # 尽量每页都有图表、表格
  requireLayouts: [table, chart]   # 这两个版式至少各出现一页
  chartTableRatio: 0.6             # 内容页里「表格 + 图表」页占比下限（2026-09 由 0.5 提上来）
  minDistinctChartTypes: 3         # 图表要「各种」：不同图型至少 3 种

# 速度档的**流程约定**（build.py 的 --speed 消费 requireZeroWarnings，其余给 Agent 读）。
# 注意：两档跑同一套 check —— 快档省的是回炉轮次与人工环节，不是检查项。
speed:
  slow:   # 默认：慢工出细活
    reviewOutline: true        # **唯一**打断用户的环节（页数/拆分等问题一并在这里问完）
    skeletonPreview: true      # 先出结构稿给自己钉页序（**内部定稿，不给用户看**）
    requireZeroWarnings: true  # warning 归零才交稿（build.py 退出码 3）
    maxRefineRounds: 3         # 回炉轮次上限（模型自己按报告改，不问用户）
    notes: true                # 自动加 --notes（演讲备注建议）
  fast:   # 直接出成品
    reviewOutline: false
    skeletonPreview: false
    requireZeroWarnings: false
    maxRefineRounds: 1
    notes: false

writing: |
  受众：参与研讨的同事 —— 他们会对着这份材料逐条讨论。
  目标：把输入资料**无遗漏**地呈现，不替读者做取舍；缺什么模块就明写缺什么、找谁要。

  ① 输入分析（排页之前不可跳过）：先落 .pi/work/analysis.md，一行一个模块
     （章节 → 模块 → 核心结论 → 论据 → 缺口），不许合并；写完直接排大纲，
     只在大纲环节让用户过目一次。
  ② 论据一条不丢：数字、口径、限定条件原样保留。允许改写措辞（长段落压成判断句、
     合并同类表述），**不许为了版面好看删内容** —— 放不下是拆页/加页，不是删；
     细则见 PPT-seminar/SKILL.md 铁律一。
  ③ 尽量每页有图表：chart / table / flow / hierarchy / compare_3col 优先，
     纯文字 statement 页 ≤ 内容页的 1/4，至少 3 种不同图型。
  ④ 内容太少就**并页**（表格 <5 行、图表数据点 ≤4 且补不出明细表、panel_2col 单侧
     要点 <3 条，或 --qc 报「还空 X in」）；两块内容一律左右分置。
  ⑤ 正文不许**精简过头**：精炼是改写措辞，不是抽掉机制与数字。
  ⑥ 交稿前必须跑 `--qc --source .pi/work/analysis.md` 核对输入覆盖度，缺的**加页补回来**。
  ⑦ 页数由资料量决定、不设上限；预计超过 50 页时先问用户
     （只讲某几章？拆成多份？还是转汇报型？），别闷头生成再交付。

  其余通用规则（版式字段与容量、结论段 40~80 字、加粗配额、图标一块一个、卡片骨架、
  一页两个信息块、宁拆页不删内容…）在 .pi/skills/ppt-common/SKILL.md；
  方向细节在 .pi/skills/ppt-seminar/SKILL.md。三者冲突时以 ppt-common 为准。
